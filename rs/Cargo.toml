[package]
name = "tabnas-jsonic"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "The relaxed jsonic grammar plugin for the tabnas parsing engine"
repository = "https://github.com/tabnas/jsonic"

[lib]
name = "tabnas_jsonic"
path = "src/lib.rs"

[dependencies]
tabnas = { path = "../../parser/rs" }
tabnas-json = { path = "../../json/rs" }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
