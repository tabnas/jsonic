[package]
name = "tabnas-jsonic"
version = "0.6.7"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "The jsonic relaxed-JSON grammar plugin for the tabnas parsing engine"
repository = "https://github.com/tabnas/jsonic"

[lib]
name = "tabnas_jsonic"
path = "src/lib.rs"

[dependencies]
# The engine and the strict-JSON core are consumed as SIBLING CHECKOUTS,
# the standard tabnas development model: clone https://github.com/tabnas/parser
# and https://github.com/tabnas/json next to this repo. Neither crate is
# published, so there is no registry version to fall back on.
tabnas = { path = "../../parser/rs" }
tabnas-json = { path = "../../json/rs" }
indexmap = "2"
regex = "1.10"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader, runner and divergence register: one loader in
# three languages, so the rows mean the same thing in every runtime.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
